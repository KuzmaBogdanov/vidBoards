# VidBoards — Multi-platform release build
#
# Triggers: push of a version tag  →  git tag v1.2.3 && git push --tags
#
# Each platform builds and publishes its artifacts directly via electron-builder.
# electron-builder creates the GitHub Release on the first job to finish;
# subsequent jobs add their files to the same release.
#
# Produces:
#   Windows  → VidBoards-Setup-x.y.z.exe  (NSIS installer, x64)
#   macOS    → VidBoards-x.y.z.dmg        (x64 + Apple Silicon)
#   Linux    → VidBoards-x.y.z.AppImage / .deb / .rpm

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ────────────────────────────────────────
  # Windows build (runs on Windows runner)
  # ────────────────────────────────────────
  build-windows:
    name: Build · Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Windows installer
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────
  # macOS build (MUST run on macOS runner)
  # ────────────────────────────────────────
  build-mac:
    name: Build · macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish macOS DMG
        run: npm run build:mac -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # env: (add MAC signing secrets here when ready)
        #   CSC_LINK:            ${{ secrets.MAC_CERT_P12_BASE64 }}
        #   CSC_KEY_PASSWORD:    ${{ secrets.MAC_CERT_PASSWORD }}
        #   APPLE_ID:            ${{ secrets.APPLE_ID }}
        #   APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        #   APPLE_TEAM_ID:       ${{ secrets.APPLE_TEAM_ID }}

  # ────────────────────────────────────────
  # Linux build (runs on Ubuntu runner)
  # ────────────────────────────────────────
  build-linux:
    name: Build · Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Linux packages
        run: npm run build:linux -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
