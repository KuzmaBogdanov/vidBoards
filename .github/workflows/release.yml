# VidBoards — Multi-platform release build
#
# Triggers: push of a version tag  →  git tag v1.2.3 && git push --tags
#
# Produces:
#   Windows  → VidBoards-Setup-x.y.z.exe  (NSIS installer, x64)
#   macOS    → VidBoards-x.y.z.dmg        (x64 + Apple Silicon universal)
#   Linux    → VidBoards-x.y.z.AppImage   (x64)
#              vidboards_x.y.z_amd64.deb
#              vidboards-x.y.z.x86_64.rpm

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # needed to create a GitHub Release and upload assets

jobs:
  # ────────────────────────────────────────
  # Windows build (runs on Windows runner)
  # ────────────────────────────────────────
  build-windows:
    name: Build · Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/*.exe
          retention-days: 7

  # ────────────────────────────────────────
  # macOS build (MUST run on macOS runner)
  # DMG creation requires macOS toolchain.
  # ────────────────────────────────────────
  build-mac:
    name: Build · macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (optional — remove if you don't have an Apple Developer account)
          # CSC_LINK:            ${{ secrets.MAC_CERT_P12_BASE64 }}
          # CSC_KEY_PASSWORD:    ${{ secrets.MAC_CERT_PASSWORD }}
          # APPLE_ID:            ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          # APPLE_TEAM_ID:       ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 7

  # ────────────────────────────────────────
  # Linux build (runs on Ubuntu runner)
  # ────────────────────────────────────────
  build-linux:
    name: Build · Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          retention-days: 7

  # ────────────────────────────────────────
  # Create GitHub Release with all artifacts
  # Runs after all three builds succeed
  # ────────────────────────────────────────
  publish-release:
    name: Publish Release
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: release-assets/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: mac-dist
          path: release-assets/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VidBoards ${{ github.ref_name }}
          draft: true           # set to false to publish immediately
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## VidBoards ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | 🪟 Windows | `VidBoards-Setup-*.exe` |
            | 🍎 macOS (Intel + Apple Silicon) | `VidBoards-*.dmg` |
            | 🐧 Linux | `VidBoards-*.AppImage` · `*.deb` · `*.rpm` |

            ### Installation
            - **Windows**: Run the `.exe` installer
            - **macOS**: Open `.dmg`, drag VidBoards to Applications. If blocked by Gatekeeper: right-click → Open.
            - **Linux (AppImage)**: `chmod +x VidBoards-*.AppImage && ./VidBoards-*.AppImage`
            - **Linux (deb)**: `sudo dpkg -i vidboards_*_amd64.deb`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
