<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' file: data: blob:">
  <title>VidBoards</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vendor/tabler-icons/tabler-icons.min.css">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
</head>
<body class="dark">

<!-- ── TITLEBAR ── -->
<div class="titlebar">
  <div class="logo">
    <span class="logo-text">VidBoards</span>
    <span class="logo-ver">v1.4</span>
  </div>
  <div class="titlebar-tabs" id="titlebar-tabs"></div>
  <div class="titlebar-right">
    <button class="tb-icon-btn" id="btn-settings" title="Настройки"><i class="ti ti-settings"></i></button>
  </div>
</div>

<!-- ── SCREENS ── -->
<div id="screen-home"     class="screen active"></div>
<div id="screen-board"    class="screen"></div>
<div id="screen-settings" class="screen"></div>

<!-- ── CONTEXT MENU ── -->
<div class="ctx-menu" id="ctx-menu"></div>

<!-- ── MODAL ── -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modal-title"></span>
      <button class="modal-close" id="modal-close"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- ── HINT TOAST ── -->
<div class="hint" id="hint"></div>

<script src="renderer.js"></script>
</body>
</html>
